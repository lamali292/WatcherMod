name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z). Leave empty to auto-bump the patch number.'
        required: false
      game_version:
        description: 'STS2 version for min_game_version (e.g. 0.107.1). Empty = keep current.'
        required: false
      steam:
        description: 'Also upload to Steam Workshop'
        type: boolean
        default: true
      nexus:
        description: 'Also upload to Nexus'
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  MEGADOT_VERSION: 4.5.1-m.11
  SPINE_VERSION: 4.2-4.5.1-stable
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean stale build artifacts
        run: rm -rf .godot obj bin

      # Manual runs: bump versions in the repo, commit, and tag — the CI replacement for release.ps1's
      # front half. Pushes made with GITHUB_TOKEN don't retrigger workflows, so no double run.
      - name: Bump versions and tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CURRENT=$(grep -oE '<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>' build/mod.build.props | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(echo "$CURRENT" | awk -F. '{print $1"."$2"."$3+1}')
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists"; exit 1
          fi
          BASELIB=$(grep -oE '<BaseLibVersion>[^<]+' build/mod.build.props | sed 's/<BaseLibVersion>//')

          perl -0pi -e "s/<Version>\d+\.\d+\.\d+<\/Version>/<Version>$VERSION<\/Version>/" build/mod.build.props
          perl -0pi -e "s/<AssemblyVersion>\d+\.\d+\.\d+\.\d+<\/AssemblyVersion>/<AssemblyVersion>$VERSION.0<\/AssemblyVersion>/" build/mod.build.props
          perl -0pi -e "s/<FileVersion>\d+\.\d+\.\d+\.\d+<\/FileVersion>/<FileVersion>$VERSION.0<\/FileVersion>/" build/mod.build.props
          perl -0pi -e "s/(\"version\"\s*:\s*\")\d+\.\d+\.\d+(\")/\${1}$VERSION\${2}/" Watcher.json
          GV="${{ inputs.game_version }}"
          if [ -n "$GV" ]; then
            GV="${GV#v}"
            perl -0pi -e "s/(\"min_game_version\"\s*:\s*\")[^\"]+(\")/\${1}$GV\${2}/" Watcher.json
          fi
          # CAVEAT (from release.ps1): NuGet BaseLib version may differ from the in-game BaseLib
          # mod version the loader checks — remove this line if they don't match.
          perl -0pi -e "s/(\"id\"\s*:\s*\"BaseLib\"\s*,\s*\"min_version\"\s*:\s*\")[^\"]+(\")/\${1}$BASELIB\${2}/" Watcher.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/mod.build.props Watcher.json
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME" --tags
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache engine downloads
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: |
            megadot.zip
            spine-godot.zip
          key: engine-${{ env.MEGADOT_VERSION }}-${{ env.SPINE_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: nuget-

      - name: Cache Godot import results
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ env.MEGADOT_VERSION }}-${{ hashFiles('**/*.png', '**/*.svg', '**/*.wav', '**/*.ogg', '**/*.spine-json', '**/*.skel', '**/*.import') }}
          restore-keys: godot-import-${{ env.MEGADOT_VERSION }}-

      - name: Download MegaDot
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: curl -L -o megadot.zip "https://megadot.megacrit.com/${MEGADOT_VERSION}/megadot-${MEGADOT_VERSION}-linux-x86_64-editor-csharp.zip"

      - name: Download spine-godot extension
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o spine-godot.zip \
            "https://spine-godot.s3.eu-central-1.amazonaws.com/4.2/4.5.1-stable/spine-godot-extension-${SPINE_VERSION}.zip"

      - name: Install engine
        run: |
          unzip -q megadot.zip -d megadot
          chmod +x megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64
          echo "GODOT_PATH=$(pwd)/megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          unzip -oq spine-godot.zip -d "${{ github.workspace }}"

      # Tag pushes: version comes from the tag (v1.2.3 -> 1.2.3). Manual runs set VERSION in the bump step.
      - name: Set version from tag
        if: github.event_name != 'workflow_dispatch'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be vX.Y.Z, got $GITHUB_REF_NAME"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Patch the manifest's top-level "version" to match the tag (build-time only, not committed).
      # min_game_version and the BaseLib min_version stay as committed in the repo.
      - name: Sync manifest version
        run: |
          sed -i -E 's/("version"[[:space:]]*:[[:space:]]*")[0-9]+\.[0-9]+\.[0-9]+(")/\1'"$VERSION"'\2/' Watcher.json
          grep '"version"' Watcher.json

      # Atlases are generated, not committed: build them BEFORE Godot imports them.
      - name: Build image atlases
        run: dotnet run --project ImageGen -c Release

      - name: Import Godot resources
        run: |
          "$GODOT_PATH" --headless --audio-driver Dummy --import || true
          "$GODOT_PATH" --headless --audio-driver Dummy --import

      - name: Publish
        run: |
          mkdir -p "${{ github.workspace }}/output/mods"
          dotnet publish Watcher.csproj -c Release \
            /p:GodotPath="$GODOT_PATH" \
            /p:ModsPath="${{ github.workspace }}/output/mods/" \
            /p:SkipGodotImport=true \
            /p:Version="$VERSION" \
            /p:AssemblyVersion="$VERSION.0" \
            /p:FileVersion="$VERSION.0"

      # Zip ONLY the Watcher folder (BaseLib is a sibling in mods/ and is deliberately excluded),
      # without .pdb files — mirrors what release.ps1's staging did.
      - name: Package zip
        run: |
          test -d output/mods/Watcher || { echo "Built mod folder missing"; exit 1; }
          find output/mods/Watcher -name '*.pdb' -delete
          cd output/mods
          zip -r "../../Watcher-$VERSION.zip" Watcher
          cd ../..
          unzip -l "Watcher-$VERSION.zip"

      # Banner values come from the committed manifest instead of the local game install.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIN_GAME=$(grep -oE '"min_game_version"[[:space:]]*:[[:space:]]*"[^"]+"' Watcher.json | sed -E 's/.*"([^"]+)"$/\1/' || true)
          BASELIB=$(grep -oE '<BaseLibVersion>[^<]+</BaseLibVersion>' build/mod.build.props | sed -E 's/<\/?BaseLibVersion>//g' || true)
          {
            echo "Works with Slay the Spire 2 version ${MIN_GAME:-unknown} or newer."
            echo "Requires BaseLib ${BASELIB:-unknown} (not included — install it separately)."
          } > banner.md
          gh release create "v$VERSION" "Watcher-$VERSION.zip" \
            --title "Watcher v$VERSION - StS2 v${MIN_GAME:-unknown}" \
            --generate-notes \
            --notes-file banner.md

      # ---- Steam Workshop upload (opt-in) ----
      # Requires repo VARIABLE  STEAM_WORKSHOP_ID  (the id from mod_id.txt)
      # and repo SECRETS:
      #   STEAM_USERNAME     - builder account login name
      #   STEAM_CONFIG_VDF   - cached SteamCMD session (same config.vdf pattern as Downfall's
      #                        release.yml) instead of live password+TOTP
      - name: Upload to Steam Workshop
        if: vars.STEAM_WORKSHOP_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.steam)
        uses: m00nl1ght-dev/steam-workshop-deploy@v4
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 2868840
          publishedFileId: ${{ vars.STEAM_WORKSHOP_ID }}
          path: output/mods/Watcher
          changeNote: "Release v${{ env.VERSION }} - https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}"

      - name: Upload to NexusMods
        # Removed inputs.nexus since it wasn't defined in your workflow_dispatch inputs
        if: inputs.nexus
        uses: Nexus-Mods/upload-action@v1.0.0-beta.7
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: 7342526
          # Point directly to the zip file you created in the Package zip step
          filename: Watcher-${{ env.VERSION }}.zip
          version: ${{ env.VERSION }}
          # Hardcode the display string since env.DISPLAY was removed
          display_name: The Watcher v${{ env.VERSION }}
          # Replaced missing steps.notes with a static description or you can read your banner.md here
          description: "Release v${{ env.VERSION }}"
          file_category: main
          archive_existing_file: true
          allow_mod_manager_download: true